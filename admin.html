<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Digital Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Admin Dashboard</div>
        <nav>
            <ul>
                <li><a href="index.html">Back to Library</a></li>
                <li><a href="#" id="admin-logout-btn">Logout</a></li>
            </ul>
        </nav>
    </header>

    <section class="admin-dashboard">
        
        <div class="admin-container" style="margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 2px solid #ecf0f1;">
            <h2>➕ Add a New Category</h2>
            <p>Create custom genres for the library catalog.</p>
            <div style="display: flex; gap: 10px; margin-top: 1rem;">
                <input type="text" id="new-category-name" placeholder="e.g., Sci-Fi, Drama, Cookbooks..." style="flex: 1; padding: 0.8rem; border: 1px solid #bdc3c7; border-radius: 4px;">
                <button id="add-category-btn" style="background: #3498db; color: white; border: none; padding: 0.8rem 1.5rem; cursor: pointer; border-radius: 4px; font-weight: bold;">Add Category</button>
            </div>
        </div>

        <div class="admin-container">
            <h2>Add a New Book</h2>
            <p>Fill out this form to add a book and upload its cover.</p>

            <form id="add-book-form">
                <div class="input-group">
                    <label for="book-title">Book Title</label>
                    <input type="text" id="book-title" required>
                </div>

                <div class="input-group">
                    <label for="book-author">Author</label>
                    <input type="text" id="book-author" required>
                </div>

                <div class="input-group">
                    <label for="book-isbn">ISBN Number</label>
                    <input type="text" id="book-isbn" required>
                </div>

                <div class="input-group">
                    <label for="book-category">Category</label>
                    <select id="book-category" required>
                        <option value="classic">Classic</option>
                        <option value="fantasy">Fantasy</option>
                        <option value="dystopian">Dystopian</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="book-image">Cover Image</label>
                    <input type="file" id="book-image" accept="image/png, image/jpeg, image/jpg" required>
                </div>

                <button type="submit" class="action-btn" style="width: 100%;">Add Book to Library</button>
            </form>
        </div>
    </section>

    <script src="admin.js"></script>
</body>
</html>
